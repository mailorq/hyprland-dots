# QHD-first, FHD-safe reading geometry.  All lengths here are Kitty points
# unless a px unit is stated explicitly.
font_family monospace
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

window_padding_width 10
window_border_width 1px
draw_minimal_borders yes
active_border_color #B39A6A
inactive_border_color #655B58
bell_border_color #C9796C
placement_strategy center

cursor_shape beam
cursor_beam_thickness 1.5
scrollback_lines 10000
enable_audio_bell no
