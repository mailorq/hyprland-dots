# Render no Hyprland splash over the Fata Morgana artwork. / Не показывать
# заставку Hyprland поверх иллюстрации Fata Morgana.
splash = false

# Keep official hyprpaper IPC available for inspection only. / Оставить IPC
# hyprpaper для проверки активного обоя, без скриптов случайной смены.
ipc = true

# Use one calm fallback on every output until a local monitor-specific choice
# is deliberately made. / Использовать один спокойный fallback на всех экранах,
# пока локально не задан осознанный обой для конкретного монитора.
wallpaper {
    monitor =
    path = ~/.local/share/fata-morgana/wallpapers/fata-morgana-016-violet-cloaked-portrait-wallpaper-16x9.jpg
    fit_mode = cover
}
